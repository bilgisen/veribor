[project]
name = "veribor"
version = "0.1.0"
description = "BIST canli fiyat verisi alternatif kaynagi (Anadolu Ajansi, Is Yatirim, Oyak Yatirim) - FastAPI Cloud icin"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "redis>=5.0",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
